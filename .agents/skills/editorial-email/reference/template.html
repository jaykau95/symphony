<!DOCTYPE html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>{{SUBJECT}}</title>
<!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><![endif]-->
<style>
  :root { color-scheme: light only; supported-color-schemes: light only; }
  body,table,td,a{-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%}
  table,td{mso-table-lspace:0;mso-table-rspace:0}
  img{-ms-interpolation-mode:bicubic;border:0;outline:none;text-decoration:none;display:block}
  a{text-decoration:none}
  @media screen and (max-width:600px){
    .card{width:100%!important}
    .pad{padding-left:24px!important;padding-right:24px!important}
    .h1{font-size:25px!important;line-height:33px!important}
    .stat{font-size:40px!important}
  }
</style>
</head>
<body style="margin:0;padding:0;background-color:#F0EDE8;">
<div style="display:none;font-size:1px;color:#F0EDE8;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">{{PREHEADER}}</div>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#F0EDE8;">
<tr><td align="center" style="padding:0;">

  <!-- ============ CARD ============ -->
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" class="card" style="width:600px;max-width:600px;background-color:#FFFFFF;">

    <!-- Masthead -->
    <tr><td align="center" style="padding:28px 44px 24px;border-bottom:1px solid #D9D9D9;">
      <img src="{{LOGO_URL}}" width="180" height="51" alt="{{BRAND}}" style="display:block;width:180px;max-width:180px;height:auto;border:0;margin:0 auto;">
    </td></tr>

    <!-- Eyebrow -->
    <tr><td align="center" class="pad" style="padding:40px 44px 0;">
      <p style="margin:0;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:10px;line-height:14px;letter-spacing:.18em;text-transform:uppercase;color:#8C877B;">{{EYEBROW}}</p>
    </td></tr>

    <!-- Hero headline -->
    <tr><td align="center" class="pad" style="padding:24px 44px 0;">
      <h1 class="h1" style="margin:0;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:400;font-size:30px;line-height:39px;color:#111111;">{{HEADLINE}}</h1>
    </td></tr>

    <!-- Opening paragraphs -->
    <tr><td class="pad" style="padding:33px 44px 0;">
      <p style="margin:0;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:26px;color:#333333;">{{PARA_1}}</p>
      <p style="margin:28px 0 0;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:26px;color:#333333;">{{PARA_2}}</p>
    </td></tr>

    <!-- Hero image — DELETE THIS ROW ENTIRELY if you have no real asset -->
    <tr><td class="pad" style="padding:48px 44px 0;">
      <img src="{{IMAGE_URL}}" width="512" alt="{{IMAGE_ALT}}" style="display:block;width:100%;max-width:512px;height:auto;border:0;">
    </td></tr>

    <!-- Stat panel -->
    <tr><td class="pad" style="padding:56px 44px 0;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#F0EDE8;">
        <tr><td align="center" style="padding:36px 32px 40px;">
          <p class="stat" style="margin:0;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:48px;line-height:52px;color:#111111;">{{STAT}}</p>
          <p style="margin:14px 0 0;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:10px;line-height:14px;letter-spacing:.18em;text-transform:uppercase;color:#8C877B;">{{STAT_LABEL}}</p>
          <p style="margin:18px 0 0;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:26px;color:#333333;">{{STAT_SENTENCE}}</p>
        </td></tr>
      </table>
    </td></tr>

    <!-- Roman-numeral sections — repeat this row, 3 to 5 times -->
    <tr><td class="pad" style="padding:40px 44px 0;">
      <p style="margin:0;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:10px;line-height:14px;letter-spacing:.18em;text-transform:uppercase;color:#8C877B;">{{I. SECTION LABEL}}</p>
      <p style="margin:12px 0 0;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:26px;color:#333333;">{{SECTION_BODY}}</p>
    </td></tr>

    <!-- Divider -->
    <tr><td class="pad" style="padding:48px 44px 0;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"><tr>
        <td style="border-top:1px solid #D8D4CD;font-size:0;line-height:0;">&nbsp;</td>
      </tr></table>
    </td></tr>

    <!-- Closing line -->
    <tr><td align="center" class="pad" style="padding:36px 44px 0;">
      <p style="margin:0;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:20px;line-height:26px;color:#111111;">{{CLOSING_LINE}}</p>
    </td></tr>

    <!-- CTA -->
    <tr><td align="center" class="pad" style="padding:32px 44px 0;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
        <td bgcolor="#111111" style="background-color:#111111;">
          <a href="{{CTA_URL}}" style="display:block;padding:13px 28px;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:11px;line-height:12px;letter-spacing:.14em;text-transform:uppercase;color:#FFFFFF;text-decoration:none;">{{CTA_LABEL}}</a>
        </td>
      </tr></table>
    </td></tr>

    <!-- Micro-copy -->
    <tr><td align="center" class="pad" style="padding:20px 44px 56px;">
      <p style="margin:0;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#8A8578;">{{MICROCOPY}}</p>
    </td></tr>

  </table>
  <!-- ============ /CARD ============ -->

  <!-- Footer, outside the card -->
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" class="card" style="width:600px;max-width:600px;">
    <tr><td align="center" class="pad" style="padding:28px 44px 40px;">
      <p style="margin:0;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#8A8578;">
        <a href="{{PREFS_URL}}" style="color:#8A8578;text-decoration:underline;">Update your preferences</a> or <a href="{{UNSUB_URL}}" style="color:#8A8578;text-decoration:underline;">unsubscribe</a>
      </p>
      <p style="margin:8px 0 0;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#8A8578;">{{ADDRESS_1}}<br>{{ADDRESS_2}}<br>&copy; {{BRAND}}</p>
    </td></tr>
  </table>

</td></tr>
</table>
</body>
</html>
