[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "symphony"
version = "0.1.0"
description = "Symphony: autonomous coding-agent orchestrator for Linear issues"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
symphony = "symphony.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["symphony*"]
